name: Build
on:
  push:
    branches-ignore:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build base Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        cache-from: type=gha,scope=opam-docker-cache
        cache-to: type=gha,mode=max,scope=opam-docker-cache
        target: builder_workspace
        outputs: type=local,dest=./build-env
        push: false

    - name: Build tester Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        cache-from: type=gha,scope=opam-docker-cache
        cache-to: type=gha,mode=max,scope=opam-docker-cache
        target: tester_workspace
        outputs: type=local,dest=./test-env
        push: false

    - name: Get Alcotest version
      id: alcotest-version
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/test-env:/home/opam/app \
          -w /home/opam/app \
          ocaml/opam:debian-12-ocaml-5.5 \
          echo version=$(opam info alcotest --color=never | sed -n 's#.*\(version\)[[:space:]]*\([0-9]\+\(\.[0-9]\+\)*\).*#\2#p')" >> $GITHUB_OUTPUT"

    - name: Get testing start timestamp
      id: test-start-timestamp
      run: echo "timestamp=$(date '+%Y-%m-%dT%H:%M:%S')" >> "$GITHUB_OUTPUT"

    - name: Run tests
      id: run-tests
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/test-env:/home/opam/app \
          -w /home/opam/app \
          ocaml/opam:debian-12-ocaml-5.5 \
          bash -c "eval \$(opam env) && dune runtest 2> >(tee test_results.txt)"

    - name: Get testing end timestamp
      id: test-end-timestamp
      run: echo "timestamp=$(date '+%Y-%m-%dT%H:%M:%S')" >> "$GITHUB_OUTPUT"
      if: success() || steps.run-tests.outcome == 'failure'

    - name: Upload runtest output artifact
      id: upload-test-output
      uses: actions/upload-artifact@v7
      with:
          name: alcotest-raw
          path: test_results.txt
      if: success() || steps.run-tests.outcome == 'failure'

    - name: Process test output
      id: process-test-output
      uses: georgejkaye/alcotest-github-action@v2.8.0
      with:
        alcotest-input-path: test_results.txt
        ctrf-output-path: alcotest-ctrf.json
        start-timestamp: ${{ steps.test-start-timestamp.outputs.timestamp }}
        end-timestamp:  ${{ steps.test-end-timestamp.outputs.timestamp }}
        alcotest-version: ${{ steps.alcotest-version.outputs.version }}
      if: success() || steps.upload-test-output.outcome == 'success'

    - name: Upload test results artifact
      id: upload-test-ctrf
      uses: actions/upload-artifact@v7
      with:
          name: alcotest-ctrf
          path: alcotest-ctrf.json
      if: success() || steps.process-test-output.outcome == 'success'

    - name: Publish test report
      uses: ctrf-io/github-test-reporter@v1.3.0
      with:
        report-path: alcotest-ctrf.json
        upload-artifact: true
        fetch-previous-results: true
        github-report: true
        failed-folded-report: true
        suite-folded-report: true
        always-group-by: true
        group-by: suite
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: success() || steps.upload-test-ctrf.outcome == 'success'