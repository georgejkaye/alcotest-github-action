name: Build and push Docker image to dockerhub
on:
  push:
    branches:
      - main

env:
  DOCKER_BUILD_TAG: ${{ vars.DOCKERHUB_REPO }}:build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        outputs: type=docker,dest=${{ runner.temp }}/image.tar
        tags: ${{ env.DOCKER_BUILD_TAG }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: image
        path: ${{ runner.temp }}/image.tar


  version:
    runs-on: ubuntu-latest
    needs:
      - build

    outputs:
      version: ${{ steps.version.outputs.fullSemVer }}
      docker-release-tag: ${{ steps.tag.outputs.tag }}

    permissions:
      contents: write

    concurrency:
      group: versioning
      queue: max

    steps:

    - name: Check out repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
          versionSpec: 6.8.x

    - name: Get version
      id: version
      uses: gittools/actions/gitversion/execute@v4.7.0

    - name: Remove existing tags
      run: |
        if [ $(git tag -l "v${{ steps.version.outputs.fullSemVer }}") ]; then
          git tag -d v${{ steps.version.outputs.fullSemVer }}
          git push --delete v${{ steps.version.outputs.fullSemVer }}
        fi

    - name: Export docker tag variable
      id: tag
      run: echo "tag=${{ vars.DOCKERHUB_REPO }}:v${{ steps.version.outputs.fullSemVer }}" >> "$GITHUB_OUTPUT"


  push:
    runs-on: ubuntu-latest

    needs:
      - version

    concurrency:
      group: versioning
      queue: max

    steps:

      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
            name: image
            path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/image.tar

      - name: Tag image
        run: |
          docker tag ${{ env.DOCKER_BUILD_TAG }} ${{ needs.version.outputs.docker-release-tag }}

      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to dockerhub
        run: |
          docker push ${{ needs.version.outputs.docker-release-tag }}

      - name: Update dockerhub description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPO }}

  update:
    runs-on: ubuntu-latest

    needs:
      - version
      - push

    permissions:
      contents: write

    concurrency:
      group: versioning
      queue: max

    steps:

      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update dockerhub tag in action yml
        run: |
          sed -i \
            "s#image: .*#image: docker://${{ needs.version.outputs.docker-release-tag }}#" \
            action.yml

      - name: Commit updated action yml
        uses: EndBug/add-and-commit@v11.1.1
        with:
          add: action.yml
          message: "ci: update tag"
          tag: v${{ needs.version.outputs.version }}

