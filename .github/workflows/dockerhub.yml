name: Build and push Docker image to dockerhub
on:
  push:
    branches:
      - main

env:
  DOCKER_BUILD_TAG: ${{ vars.DOCKERHUB_REPO }}:build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Login to dockerhub
      uses: docker/login-action@v3
      with:
       username: ${{ secrets.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push to dockerhub
      uses: docker/build-push-action@v5
      with:
        outputs: type=docker,dest=${{ runner.temp }}/image.tar
        tags: ${{ env.DOCKER_BUILD_TAG }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: image
        path: ${{ runner.temp }}/image.tar


  version:
    runs-on: ubuntu-latest
    needs:
      - build
    outputs:
      version: ${{ steps.version.outputs.fullSemVer }}

    permissions:
      contents: write

    concurrency:
      group: versioning
      queue: max

    steps:

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
          versionSpec: 6.8.x

    - name: Get version
      id: version
      uses: gittools/actions/gitversion/execute@v4.7.0

    - name: Remove existing tags
      run: |
        if [ $(git tag -l "v${{ steps.version.outputs.fullSemVer }}") ]; then
          git tag -d v${{ steps.version.outputs.fullSemVer }}
          git push --delete v${{ steps.version.outputs.fullSemVer }}
        fi

    - name: Update dockerhub tag in action yml
      run: |
        sed -i \
          "s#image: docker://georgejkaye/alcotest-github-action:v[0-9.]*#image: docker://georgejkaye/alcotest-github-action:v${{ env.GitVersion_FullSemVer }}#" \
          action.yml

    - name: Commit updated action yml
      uses: EndBug/add-and-commit@v11.1.1
      with:
        pull: "--rebase"
        add: action.yml
        message: "build: update tag"
        tag: v${{ steps.version.outputs.fullSemVer }}

  push:
    runs-on: ubuntu-latest
    needs:
      - build
      - version

    env:
      DOCKER_RELEASE_TAG: ${{ vars.DOCKERHUB_REPO }}:v${{ needs.version.outputs.version }}

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
            name: image
            path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/image.tar

      - name: Tag image
        run: |
          docker tag ${{ env.DOCKER_BUILD_TAG }} ${{ env.DOCKER_RELEASE_TAG }}

      - name: Build and push to dockerhub
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.DOCKER_RELEASE_TAG }}

      - name: Update dockerhub description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPO }}
