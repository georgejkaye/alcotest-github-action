name: Alcotest
description: Build OCaml project and run Alcotest tests
inputs:
  dune-runtest-input-path:
    description: The path to the output generated by dune runtest
    required: true
  test-summary-output-path:
    description: The path to write the test summary output json to
    required: false
    default: alcotest.json
runs:
  using: docker
  image: docker://georgejkaye/alcotest-github-action:latest
  args:
    - ${{ inputs.dune-runtest-input-path }}
    - ${{ inputs.test-summary-output-path }}
