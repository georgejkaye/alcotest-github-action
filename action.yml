name: Alcotest
description: Build OCaml project and run Alcotest tests
inputs:
  alcotest-input-path:
    description: The path to the output generated by Alcotest
    required: true
  ctrf-output-path:
    description: The path to write the ctrf test json output to
    required: false
    default: alcotest.json
  start-timestamp:
    description: The timestamp testing began at
    required: true
  end-timestamp:
    description: The timestamp testing finished at
    required: true
  alcotest-version:
    description: The version of Alcotest testing was run with
    required: false
runs:
  using: docker
  image: docker://georgejkaye/alcotest-github-action:v2.7.0
  args:
    - ${{ inputs.alcotest-input-path }}
    - ${{ inputs.ctrf-output-path }}
    - ${{ inputs.start-timestamp }}
    - ${{ inputs.end-timestamp }}
    - ${{ inputs.alcotest-version }}
